name: Build unsigned IPA

on:
  push:
    branches: ["claude/**", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild -project WakeUp.xcodeproj -target WakeUp \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/WakeUp.app out/Payload/
          ls out/Payload/WakeUp.app/PlugIns || echo "⚠️ no PlugIns"
          cd out && zip -qry WakeUp-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WakeUp-unsigned-ipa
          path: out/WakeUp-unsigned.ipa
          retention-days: 14

      # 固定網址，手機 Safari 不用登入就能下載：
      # https://github.com/${{ github.repository }}/releases/download/poc-latest/WakeUp-unsigned.ipa
      - name: Publish to release "poc-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete poc-latest -y --cleanup-tag || true
          gh release create poc-latest out/WakeUp-unsigned.ipa \
            --prerelease --target "$GITHUB_SHA" \
            --title "PoC 最新版（build ${{ github.run_number }}）" \
            --notes "未簽名 IPA，用 Feather 簽名安裝。commit ${GITHUB_SHA::7}"
